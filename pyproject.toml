[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-multi-agent-workflow"
version = "0.1.0"
description = "Codex-native Multi-Agent Workflow tools and templates"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Codex MAW Contributors"}
]
license = {text = "MIT"}
dependencies = []

[project.scripts]
maw = "maw_cli:main"

[tool.setuptools]
packages = ["maw_cli"]

[tool.setuptools.package-data]
maw_cli = [
  "py.typed",
  "vendor/*.js",
  "data/maw-tools/*.py",
  "data/packs/**/*.*",
  "data/schemas/*.json",
  "data/templates/workflows/*.json",
  "data/examples/ml_problems/*.py",
  "data/examples/ml_problems/hard_examples/*.json",
  "data/examples/salvage_js_ts/*.*",
  "data/examples/salvage_topologies/**/*.*"
]
