[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-multi-agent-workflow"
version = "0.1.0"
description = "Codex-native Multi-Agent Workflow tools and templates"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Codex MAW Contributors"}
]
license = {text = "MIT"}
dependencies = []

[project.scripts]
maw = "maw_cli:main"

[tool.setuptools]
py-modules = [
  "fibonacci",
  "todo_api"
]
packages = ["maw_cli"]

[tool.setuptools.package-data]
maw_cli = [
  "py.typed",
  "data/maw-tools/*.py",
  "data/templates/workflows/*.json",
  "data/examples/ml_problems/*.py"
]
